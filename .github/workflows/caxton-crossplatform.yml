name: Caxton 0.6.4 Cross-Platform Forge 1.20.1

on:
  push:
    branches: [caxton-crossplatform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-natives:
    name: Linux x64 + ARM64 natives
    runs-on: ubuntu-22.04
    steps:
      - name: Clone Caxton 0.6.4 upstream
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Install Rust and cross
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          source "$HOME/.cargo/env"
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Configure Linux cross targets
        shell: bash
        run: |
          cat > caxton/common/caxton-impl/Cross.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main"
          pre-build = ["apt-get update && apt-get install --assume-yes --no-install-recommends libclang-dev clang"]

          [target.aarch64-unknown-linux-gnu]
          image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main"
          pre-build = ["apt-get update && apt-get install --assume-yes --no-install-recommends libclang-dev clang"]
          EOF

      - name: Build Linux natives
        shell: bash
        working-directory: caxton/common/caxton-impl
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          cross build --locked --release --target x86_64-unknown-linux-gnu
          cross build --locked --release --target aarch64-unknown-linux-gnu
          mkdir -p ../../../native-out
          cp target/x86_64-unknown-linux-gnu/release/libcaxton_impl.so ../../../native-out/x86_64-unknown-linux-gnu-libcaxton_impl.so
          cp target/aarch64-unknown-linux-gnu/release/libcaxton_impl.so ../../../native-out/aarch64-unknown-linux-gnu-libcaxton_impl.so

      - name: Verify Linux ELF architecture and glibc requirements
        shell: bash
        run: |
          set -euxo pipefail
          file native-out/*.so
          for f in native-out/*.so; do
            echo "=== $f ==="
            readelf -h "$f" | grep -E 'Class:|Machine:'
            strings "$f" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -n 10 || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux
          path: native-out/*
          if-no-files-found: error

  windows-x64:
    name: Windows x64 native
    runs-on: windows-2025
    steps:
      - name: Clone Caxton 0.6.4 upstream
        shell: pwsh
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Install Rust x64 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'x86_64-pc-windows-msvc'
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$target/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe -y --profile minimal --default-host $target --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows x64 native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          Push-Location caxton\common\caxton-impl
          cargo build --locked --release --target x86_64-pc-windows-msvc
          Pop-Location
          New-Item -ItemType Directory -Force native-out | Out-Null
          Copy-Item caxton\common\caxton-impl\target\x86_64-pc-windows-msvc\release\caxton_impl.dll native-out\x86_64-pc-windows-msvc-caxton_impl.dll
          Get-Item native-out\* | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-x64
          path: native-out/*
          if-no-files-found: error

  windows-arm64:
    name: Windows ARM64 native
    runs-on: windows-11-arm
    steps:
      - name: Clone Caxton 0.6.4 upstream
        shell: pwsh
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Install Rust ARM64 MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'aarch64-pc-windows-msvc'
          Invoke-WebRequest "https://static.rust-lang.org/rustup/dist/$target/rustup-init.exe" -OutFile rustup-init.exe
          .\rustup-init.exe -y --profile minimal --default-host $target --default-toolchain stable
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows ARM64 native
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          Push-Location caxton\common\caxton-impl
          cargo build --locked --release --target aarch64-pc-windows-msvc
          Pop-Location
          New-Item -ItemType Directory -Force native-out | Out-Null
          Copy-Item caxton\common\caxton-impl\target\aarch64-pc-windows-msvc\release\caxton_impl.dll native-out\aarch64-pc-windows-msvc-caxton_impl.dll
          Get-Item native-out\* | Format-List Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-arm64
          path: native-out/*
          if-no-files-found: error

  macos-x64:
    name: macOS Intel x64 native
    runs-on: macos-15-intel
    steps:
      - name: Clone Caxton 0.6.4 upstream
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build macOS Intel native
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          rustup target add x86_64-apple-darwin
          cd caxton/common/caxton-impl
          cargo build --locked --release --target x86_64-apple-darwin
          cd ../../..
          mkdir -p native-out
          cp caxton/common/caxton-impl/target/x86_64-apple-darwin/release/libcaxton_impl.dylib native-out/x86_64-apple-darwin-libcaxton_impl.dylib
          file native-out/*.dylib
          otool -hv native-out/*.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-x64
          path: native-out/*
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon ARM64 native
    runs-on: macos-15
    steps:
      - name: Clone Caxton 0.6.4 upstream
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Install Rust
        shell: bash
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build macOS ARM64 native
        shell: bash
        run: |
          set -euxo pipefail
          source "$HOME/.cargo/env"
          rustup target add aarch64-apple-darwin
          cd caxton/common/caxton-impl
          cargo build --locked --release --target aarch64-apple-darwin
          cd ../../..
          mkdir -p native-out
          cp caxton/common/caxton-impl/target/aarch64-apple-darwin/release/libcaxton_impl.dylib native-out/aarch64-apple-darwin-libcaxton_impl.dylib
          file native-out/*.dylib
          otool -hv native-out/*.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-arm64
          path: native-out/*
          if-no-files-found: error

  package-forge:
    name: Package universal Forge JAR
    runs-on: ubuntu-22.04
    needs: [linux-natives, windows-x64, windows-arm64, macos-x64, macos-arm64]
    steps:
      - name: Clone Caxton 0.6.4 upstream
        run: git clone --depth 1 --branch 1.20.1 https://gitlab.com/Kyarei/caxton.git caxton

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: caxton/prebuilt-natives
          merge-multiple: true

      - name: Patch platform detection and Gradle native packaging
        shell: bash
        run: |
          set -euxo pipefail
          cat > caxton/common/src/main/java/xyz/flirora/caxton/dll/RustPlatform.java <<'JAVA'
          // (C) 2022-2023 +merlan #flirora.
          // SPDX-License-Identifier: MIT
          package xyz.flirora.caxton.dll;

          import xyz.flirora.caxton.CaxtonModClient;

          public class RustPlatform {
            public static String forCurrent() {
              String target = CaxtonModClient.CONFIG.rustTarget;
              if (target != null) {
                return target;
              }

              String osName = System.getProperty("os.name");
              String osArch = System.getProperty("os.arch");
              String osName3, osArch3;

              if (osName.startsWith("Windows")) {
                // MSVC is the supported Rust ABI for both modern Windows x64 and ARM64.
                osName3 = "pc-windows-msvc";
              } else if (osName.startsWith("Linux")) {
                osName3 = "unknown-linux-gnu";
              } else if (osName.startsWith("FreeBSD")) {
                osName3 = "unknown-freebsd";
              } else if (osName.startsWith("Mac OS X") || osName.startsWith("Darwin")) {
                osName3 = "apple-darwin";
              } else {
                throw new UnsupportedPlatformException(
                    "Cannot determine Rust platform name: unrecognized OS name " + osName);
              }

              osArch3 =
                  switch (osArch) {
                    case "x86_64", "amd64" -> "x86_64";
                    case "x86", "i686" -> "i686";
                    case "aarch64", "arm64" -> "aarch64";
                    default ->
                        throw new UnsupportedPlatformException(
                            "Cannot determine Rust platform name: unrecognized architecture name " + osArch);
                  };

              return osArch3 + "-" + osName3;
            }
          }
          JAVA

          python3 - <<'PY'
          from pathlib import Path
          p = Path('caxton/common/build.gradle')
          s = p.read_text()
          s = s.replace("    backend(project('caxton-impl'))", "    if (!rootProject.hasProperty('caxtonPrebuiltNatives')) {\n        backend(project('caxton-impl'))\n    }")
          s = s.replace("processResources {\n    dependsOn identifyHostRustcPlatform", "processResources {\n    if (!rootProject.hasProperty('caxtonPrebuiltNatives')) {\n        dependsOn identifyHostRustcPlatform\n    }")
          old = '''    from(configurations.backend) {\n        eachFile {\n            if (!name.contains(\"-\") && !name.contains(\"checksum\")) {\n                // Exclude the artifact from the default Cargo task\n                exclude()\n            }\n            path = \"natives/\" + path\n        }\n    }'''
          new = '''    if (rootProject.hasProperty('caxtonPrebuiltNatives')) {\n        from(rootProject.file('prebuilt-natives')) {\n            into 'natives'\n        }\n    } else {\n        from(configurations.backend) {\n            eachFile {\n                if (!name.contains(\"-\") && !name.contains(\"checksum\")) {\n                    // Exclude the artifact from the default Cargo task\n                    exclude()\n                }\n                path = \"natives/\" + path\n            }\n        }\n    }'''
          if old not in s:
              raise SystemExit('Expected backend processResources block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Generate native checksums
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64
          d = Path('caxton/prebuilt-natives')
          expected = [
              'x86_64-unknown-linux-gnu-libcaxton_impl.so',
              'aarch64-unknown-linux-gnu-libcaxton_impl.so',
              'x86_64-pc-windows-msvc-caxton_impl.dll',
              'aarch64-pc-windows-msvc-caxton_impl.dll',
              'x86_64-apple-darwin-libcaxton_impl.dylib',
              'aarch64-apple-darwin-libcaxton_impl.dylib',
          ]
          missing = [x for x in expected if not (d/x).is_file()]
          if missing:
              raise SystemExit('Missing natives: ' + ', '.join(missing))
          lines = []
          for name in expected:
              data = (d/name).read_bytes()
              digest = base64.b64encode(hashlib.sha256(data).digest()).decode('ascii')
              lines.append(f'{name}\t{len(data)}\t{digest}')
          (d/'checksums.txt').write_text('\n'.join(lines) + '\n')
          print((d/'checksums.txt').read_text())
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Forge universal JAR
        shell: bash
        working-directory: caxton
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew :forge:build -PcaxtonPrebuiltNatives=true --stacktrace

      - name: Verify universal JAR contents
        shell: bash
        run: |
          set -euxo pipefail
          JAR=$(find caxton/forge/build/libs -maxdepth 1 -type f -name 'caxton-0.6.4+1.20.1-FORGE.jar' | head -n1)
          test -n "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          unzip -l "$JAR" | tee jar-contents.txt
          for f in \
            x86_64-unknown-linux-gnu-libcaxton_impl.so \
            aarch64-unknown-linux-gnu-libcaxton_impl.so \
            x86_64-pc-windows-msvc-caxton_impl.dll \
            aarch64-pc-windows-msvc-caxton_impl.dll \
            x86_64-apple-darwin-libcaxton_impl.dylib \
            aarch64-apple-darwin-libcaxton_impl.dylib \
            checksums.txt; do
              grep -q "natives/$f" jar-contents.txt || { echo "Missing natives/$f"; exit 1; }
          done
          cp "$JAR" caxton-0.6.4+1.20.1-FORGE-crossplatform.jar
          sha256sum caxton-0.6.4+1.20.1-FORGE-crossplatform.jar | tee caxton-crossplatform.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: caxton-0.6.4-forge-1.20.1-crossplatform
          path: |
            caxton-0.6.4+1.20.1-FORGE-crossplatform.jar
            caxton-crossplatform.sha256
            jar-contents.txt
          if-no-files-found: error
